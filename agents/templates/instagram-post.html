<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* {{SHARED_STYLES}} */
body { width: 1080px; height: 1080px; margin: 0; overflow: hidden; }
.poster {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, {{PRIMARY_COLOR}} 0%, #1a1a2e 50%, {{SECONDARY_COLOR}} 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
}
.card {
    width: 920px; background: white; border-radius: 24px;
    padding: 50px 45px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.store-badge { color: {{PRIMARY_COLOR}}; font-size: 16px; font-weight: 800; letter-spacing: 2px; margin-bottom: 16px; }
.product-image-area {
    width: 350px; height: 350px; margin: 0 auto 24px;
    background: #f8f9fa; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
}
.product-image-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
.placeholder-icon { font-size: 80px; opacity: 0.3; }
.product-name { font-size: 26px; font-weight: 700; color: #212529; margin-bottom: 8px; line-height: 1.3; }
.product-brand { font-size: 15px; color: #868E96; margin-bottom: 24px; }
.price-section { margin: 20px 0; }
.price-current { font-size: 44px; font-weight: 800; color: {{ACCENT_COLOR}}; }
.price-mrp { font-size: 22px; color: #adb5bd; text-decoration: line-through; margin-left: 12px; }
.discount-badge {
    display: inline-block; background: {{SECONDARY_COLOR}}; color: white;
    font-size: 18px; font-weight: 700; padding: 8px 20px; border-radius: 24px; margin-top: 10px;
}
.highlights { margin: 20px 0; text-align: left; display: inline-block; }
.highlights div { font-size: 15px; color: #555; padding: 4px 0; }
.cta-btn {
    display: inline-block; background: {{PRIMARY_COLOR}}; color: white;
    font-size: 20px; font-weight: 700; padding: 16px 40px; border-radius: 30px; margin-top: 16px;
}
.footer-text { font-size: 13px; color: #868E96; margin-top: 16px; }
.delivery-badge {
    display: inline-block; background: rgba(40,116,240,0.08); color: {{PRIMARY_COLOR}};
    font-size: 13px; padding: 6px 16px; border-radius: 16px; margin-top: 10px;
}
</style></head><body>
<div class="poster">
    <div class="card">
        <div class="store-badge">{{STORE_NAME}}</div>
        <div class="product-image-area">
            <img src="{{PRODUCT_IMAGE}}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=placeholder-icon>📦</div>'"/>
        </div>
        <div class="product-name">{{PRODUCT_NAME}}</div>
        <div class="product-brand">{{BRAND}} · {{CATEGORY}}</div>
        <div class="price-section">
            <span class="price-current">{{SELLING_PRICE}}</span>
            <span class="price-mrp">{{MRP}}</span>
        </div>
        <div class="discount-badge">{{DISCOUNT}}</div>
        <div class="highlights">
            <div>✅ {{HIGHLIGHT_1}}</div>
            <div>✅ {{HIGHLIGHT_2}}</div>
        </div>
        <div class="cta-btn">🛒 Shop Now</div>
        <div class="footer-text">{{TAGLINE}} · Link in Bio</div>
        <div class="delivery-badge">🚚 Free Delivery on orders above ₹499</div>
    </div>
</div>
</body></html>
