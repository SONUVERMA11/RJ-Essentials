<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* {{SHARED_STYLES}} */
body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
.banner {
    width: 100%; height: 100%;
    background: linear-gradient(90deg, {{PRIMARY_COLOR}} 0%, #1a1a2e 100%);
    display: flex; position: relative;
}
.left-panel {
    width: 55%; padding: 40px 45px; display: flex; flex-direction: column; justify-content: center;
}
.right-panel {
    width: 45%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.05); position: relative;
}
.product-image-area {
    width: 320px; height: 320px; background: white; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.product-image-area img { max-width: 100%; max-height: 100%; object-fit: contain; }
.placeholder-icon { font-size: 80px; opacity: 0.3; }
.store-badge { color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 700; letter-spacing: 2px; margin-bottom: 20px; }
.product-name { color: white; font-size: 28px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
.product-desc { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 24px; }
.price-section { margin-bottom: 20px; }
.price-current { font-size: 40px; font-weight: 800; color: white; }
.price-mrp { font-size: 20px; color: rgba(255,255,255,0.4); text-decoration: line-through; margin-left: 12px; }
.discount-badge {
    display: inline-block; background: {{ACCENT_COLOR}}; color: white;
    font-size: 16px; font-weight: 700; padding: 6px 16px; border-radius: 18px; margin-top: 8px;
}
.cta-btn {
    display: inline-block; background: white; color: {{PRIMARY_COLOR}};
    font-size: 18px; font-weight: 700; padding: 14px 32px; border-radius: 28px; margin-top: 12px;
}
.footer-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.6);
    padding: 10px 20px; text-align: center; font-size: 12px;
}
</style></head><body>
<div class="banner">
    <div class="left-panel">
        <div class="store-badge">{{STORE_NAME}}</div>
        <div class="product-name">{{PRODUCT_NAME}}</div>
        <div class="product-desc">{{DESCRIPTION}}</div>
        <div class="price-section">
            <span class="price-current">{{SELLING_PRICE}}</span>
            <span class="price-mrp">{{MRP}}</span>
        </div>
        <div class="discount-badge">{{DISCOUNT}}</div>
        <div><span class="cta-btn">🛒 Shop Now</span></div>
    </div>
    <div class="right-panel">
        <div class="product-image-area">
            <img src="{{PRODUCT_IMAGE}}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=placeholder-icon>📦</div>'"/>
        </div>
    </div>
    <div class="footer-bar">Cash on Delivery Available · {{TAGLINE}} · {{WEBSITE_URL}}</div>
</div>
</body></html>
